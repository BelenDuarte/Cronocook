<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/static/img/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/CSS/Estilitos.css">             
</head>

<body>
    <!-- Enlace de navegación limpio para Litestar -->
    <a href="/" class="volver">
        <div>
            <p>Volver a la pagina principal</p>
        </div>
    </a> 

    <h2 class="titulo-grande">Lista del menu</h2>

    <!-- Contenedor tarjetas -->
    <div class="contenedor-cards" id="lista-menu">
        {% for comida in menu %}
        <div class="card-platillo" id="comida-{{ comida[0] }}">

            <div class="card-imagen">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" alt="{{ comida[1] }}">
            </div>

            <div class="card-body">
                <div class="card-header-info">
                    <div class="card-title-box">
                        <h3><i class="fa-solid fa-burger"></i> {{ comida[1] }}</h3>
                        <p class="card-tiempo"><i class="fa-regular fa-clock"></i> Prep: {{ comida[2] }} | Coc: {{ comida[3] }}</p>
                        <p class="card-envio"><i class="fa-solid fa-bicycle"></i> Gratis</p>
                        <p class="card-rating"><i class="fa-solid fa-star"></i> 4.8</p>
                    </div>
                </div>

                <div class="card-botones">
                    <!-- HTMX apuntando a las rutas REST de Litestar -->
                    <button class="btn-card-borrar"
                            hx-post="/comida/delete/{{ comida[0] }}"
                            hx-target="#comida-{{ comida[0] }}"
                            hx-swap="outerHTML"
                            hx-confirm="¿Eliminar {{ comida[1] }}?">
                        Borrar
                    </button>

                    <button class="btn-card-editar"
                            hx-get="/comida/update/{{ comida[0] }}"
                            hx-target="body">
                        Editar
                    </button>
                </div>
            </div>

        </div>
        {% endfor %}
    </div>

    <a href="/comida/add" class="agregar">
        <div>
            <p>Agregar comida</p>
        </div>
    </a> 

</body>

</html>
