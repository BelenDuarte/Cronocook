<!DOCTYPE html>

<html lang="es">
	<head>
		<title>CRONOCOOK</title>

		<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
		<link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

		<script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
	</head>

	<body>
		<header>
			<a href="#" class="logo"><i class="fas fa-hamburger"></i>CRONOCOOK Burger Shop!</a>

			<nav class="navbar">
				<a class = "active" href="#home">Incio</a>
				<a href="{{ url_for('menu') }}">Menú</a>
				<a href="#about">Información</a>
				<a href="{{ url_for('orders') }}">Pedidos</a>
			</nav>

			<div class="icons">
				<a href="#" class="fas fa-bars" id="menu-bar"></a>
				<a href="#" class="fas fa-search" id="search-icon"></a>
				<a href="#" class="fas fa-heart"></a>
				<a href="#" class="fas fa-shopping-cart"></a>
			</div>
		</header>

		<section class="home" id="home">
			<div class="swiper home-slide">
				<div class="swiper-wrapper wrapp">
					<div class="swiper-slide slide">
						<div class="contenido">
							<span>Hamburguesa</span>
							<h3>Hamburguesa</h3>
							<p>???</p>
							<a href="#" class="btn">Pedir</a>
						</div>

						<div class="image">
							<img src="{{ url_for('static', filename='images/burger.png') }}" alt="burger">
						</div>
					</div>

					<div class="swiper-slide slide">
						<div class="contenido">
							<span>Hamburguesa</span>
							<h3>Hamburguesa</h3>
							<p>???</p>
							<a href="#" class="btn">Pedir</a>
						</div>

						<div class="image">
							<img src="{{ url_for('static', filename='images/burger.png') }}" alt="burger">
						</div>
					</div>

					<div class="swiper-slide slide">
						<div class="contenido">
							<span>Hamburguesa</span>
							<h3>Hamburguesa</h3>
							<p>???</p>
							<a href="#" class="btn">Pedir</a>
						</div>

						<div class="image">
							<img src="{{ url_for('static', filename='images/burger.png') }}" alt="burger">
						</div>
					</div>
				</div>

				<div class="swiper-pagination"></div>
			</div>
		</section>

		<script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
		<script>
			var swiper = new Swiper('.home-slide', {
				spaceBetween: 30,
				centeredSlides: true,
				autoplay: {
					delay: 2500,
					disableOnInteraction: false,
				},
				pagination: {
					el: '.swiper-pagination',
					clickable: true,
				},
				loop:true,
			});
		</script>
	</body>
</html>
