<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Ruta estática directa de Litestar -->
        <link rel="stylesheet" href="/static/CSS/Estilitos.css">   
        <!-- HTMX CDN -->
        <script src="https://unpkg.com/htmx.org@1.9.10"></script>
        <title>Agregar comida</title>
    </head>
    <body>
        <!-- Enlace limpio para volver al menú -->
        <a href="/menu" class="volver">
            <div>
                <p>Volver a menu</p>
            </div>
        </a>

        <h2 class="titulo-grande">Agregar nueva comida</h2>

        <!-- Formulario configurado con atributos HTMX -->
        <form hx-post="/comida/add" 
              hx-target="#resultado-mensaje" 
              hx-swap="innerHTML">
            
            <input type="text" name="nombre" placeholder="Nombre de la comida" required><br>
            <input type="time" step="1" name="tiempo_preparacion" required><br>
            <input type="time" step="1" name="tiempo_coccion" required><br>
            
            <button type="submit">Guardar</button>
        </form>

        <!-- Contenedor donde Litestar devolverá la respuesta o confirmación -->
        <div id="resultado-mensaje"></div>

    </body>
</html>
