<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <!-- Tailwind CSS (CDN para desarrollo rápido) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen">
    
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-100">
        <span class="text-xs font-semibold tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full uppercase">Fullstack Python</span>
        <h1 class="text-3xl font-extrabold text-slate-900 mt-3 mb-2">Litestar + HTMX</h1>
        <p class="text-slate-500 mb-6 text-sm">Tu entorno con Jinja2 y Tailwind CSS está funcionando perfectamente.</p>
        
        <!-- Botón interactivo con HTMX -->
        <button hx-get="/api/saludo" 
                hx-target="#resultado" 
                hx-swap="innerHTML"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl transition-all shadow-sm shadow-indigo-100 cursor-pointer">
            Probar petición HTMX
        </button>

        <!-- Contenedor donde HTMX inyectará la respuesta del servidor -->
        <div id="resultado"></div>
    </div>

</body>
</html>
