<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="{{url_for('static', filename='CSS/Estilitos.css')}}">   
        <title>Agregar pedido</title>
    </head>
    <body>
        <a href="{{ url_for('pedidos') }}" class="volver">
            <div>
                <p>Volver a pedidos</p>
            </div>
        </a>
        <h2 class="titulo-grande">Agregar nuevo pedido</h2>

        <form action="{{ url_for('add_pedido') }}" method="POST">

                {% for comida in comidas %}
                <label for="cantidad_{{ comida[0] }}">{{comida[1]}}</label>
                <input type="number" name="cantidad_{{ comida[0] }}" placeholder="Cantidad de {{ comida[1] }}" min="0" value="0">
                <br>
                {% endfor %}
                
                <br>
            <button type="submit">Confirmar Pedido</button>
        </form>



        
    </body>

</html>
